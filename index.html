<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Surprise | Adv.Arslan Khan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page entrance-page">

    <div class="cinematic-vignette"></div>

    <div class="ambient-orb orb-one"></div>
    <div class="ambient-orb orb-two"></div>

    <div class="floating-decoration decoration-one">✦</div>
    <div class="floating-decoration decoration-two">✧</div>
    <div class="floating-decoration decoration-three">✦</div>

    <main class="entrance-screen">

        <section class="entrance-card">

            <div class="royal-icon">
                👑
            </div>

            <p class="cinematic-label">
                A PRIVATE BIRTHDAY EXPERIENCE
            </p>

            <h1 class="entrance-title">
                FOR
                <span>Adv. ARSLAN KHAN</span>
            </h1>

            <div class="gold-divider">
                <span></span>
                <i>✦</i>
                <span></span>
            </div>

            <p class="entrance-description">
                A little journey filled with memories,
                prayers, smiles and surprises.
            </p>

            <div class="lock-area">

                <div class="lock-symbol">
                    🔐
                </div>

                <p>
                    THIS EXPERIENCE IS LOCKED
                </p>

            </div>

            <div class="password-wrapper">

                <input
                    id="passwordInput"
                    type="password"
                    placeholder="Enter secret password"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="password-eye"
                    onclick="togglePassword()"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>

            <button
                class="cinematic-button"
                onclick="unlockWebsite()"
            >
                <span>ENTER THE SURPRISE</span>
                <b>→</b>
            </button>

            <p
                id="passwordMessage"
                class="password-message"
            ></p>

            <div class="sister-signature">
                Made especially for you ❤️
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
