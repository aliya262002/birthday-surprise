<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grand Finale | Adv. Arslan Khan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page finale-page">

    <div class="cinematic-vignette"></div>

    <div id="confetti-container"></div>
    <div id="fireworks-container"></div>


    <div class="finale-balloon finale-balloon-one">
        🎈
    </div>

    <div class="finale-balloon finale-balloon-two">
        🎈
    </div>


    <main class="finale-screen">

        <section class="finale-content">

            <div class="party-row">
                🎉 &nbsp; 🎈 &nbsp; 🎂 &nbsp; 🎈 &nbsp; 🎉
            </div>

            <p class="cinematic-label">
                THE FINAL CHAPTER
            </p>

            <h1>
                HAPPY
                <span>BIRTHDAY</span>
            </h1>

            <div class="final-name">
                ADV.ARSLAN KHAN
            </div>

            <div class="final-cake">
                🎂
            </div>

            <p class="final-message">
                May this year bring you
                <strong>success, happiness, peace</strong>
                and beautiful new memories.
            </p>

            <button
                class="cinematic-button final-celebration-button"
                onclick="grandFinale()"
            >
                🎊 ONE LAST CELEBRATION 🎊
            </button>

            <p class="final-love">
                Made with endless love by your sister ❤️
            </p>

        </section>

    </main>


    <a
        href="index.html"
        class="restart-button"
    >
        ↻ EXPERIENCE AGAIN
    </a>


    <button
        id="musicButton"
        class="music-control"
        onclick="toggleMusic()"
    >
        🎵 Music
    </button>


    <audio
        id="birthdayMusic"
        loop
        preload="auto"
    >
        <source
            src="music/birthday.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script src="script.js"></script>

</body>
</html>
